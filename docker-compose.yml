services:
  # The Database (SHIELDED)
  apexbid-db:
    image: postgres:15-alpine
    container_name: apexbid-postgres
    environment:
      POSTGRES_USER: vaibhav_admin
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: apexbid_db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg_apexbid_data:/var/lib/postgresql/data
    restart: unless-stopped

  # The Redis Server (SHIELDED)
  apexbid-redis:
    image: redis:7-alpine
    container_name: apexbid-redis
    command: redis-server --appendonly no --maxmemory 256mb --maxmemory-policy noeviction
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_apexbid_data:/data
    restart: unless-stopped

  # Exporters (SHIELDED)
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: apexbid-postgres-exporter
    environment:
      - DATA_SOURCE_NAME=postgresql://vaibhav_admin:${DB_PASSWORD}@apexbid-db:5432/apexbid_db?sslmode=disable
    depends_on:
      - apexbid-db

  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: apexbid-redis-exporter
    environment:
      - REDIS_ADDR=redis://apexbid-redis:6379
    depends_on:
      - apexbid-redis

  backend1:
    build: .
    container_name: apexbid-node-1
    expose:
      - "8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://apexbid-db:5432/apexbid_db
      - SPRING_DATASOURCE_USERNAME=vaibhav_admin
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - SPRING_DATA_REDIS_HOST=apexbid-redis
      - SPRING_SQL_INIT_MODE=always
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION_MS=${JWT_EXPIRATION_MS:-86400000}
      - PRODUCT_SECRET_ENCRYPTION_KEY=${PRODUCT_SECRET_ENCRYPTION_KEY}
      - NODE_ID=node-1
    depends_on:
      - apexbid-db
      - apexbid-redis

  backend2:
    build: .
    container_name: apexbid-node-2
    expose:
      - "8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://apexbid-db:5432/apexbid_db
      - SPRING_DATASOURCE_USERNAME=vaibhav_admin
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - SPRING_DATA_REDIS_HOST=apexbid-redis
      - SPRING_SQL_INIT_MODE=never
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION_MS=${JWT_EXPIRATION_MS:-86400000}
      - PRODUCT_SECRET_ENCRYPTION_KEY=${PRODUCT_SECRET_ENCRYPTION_KEY}
      - NODE_ID=node-2
    depends_on:
      - apexbid-db
      - apexbid-redis

  # Gateway (PUBLIC)
  nginx-proxy:
    image: nginx:stable-alpine
    container_name: apexbid-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend1
      - backend2

  # Monitoring Prometheus (SHIELDED)
  prometheus:
    image: prom/prometheus:latest
    container_name: apexbid-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - backend1
      - backend2

  # Monitoring UI (PUBLIC or RESTRICTED)
  grafana:
    image: grafana/grafana:latest
    container_name: apexbid-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
    depends_on:
      - prometheus

volumes:
  pg_apexbid_data:
  redis_apexbid_data:
services:
  # The Database
  apexbid-db:
    image: postgres:15-alpine
    container_name: apexbid-postgres
    environment:
      POSTGRES_USER: vaibhav_admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: apexbid_db
    ports:
      - "5432:5432"
    volumes:
      - pg_apexbid_data:/var/lib/postgresql/data
    restart: unless-stopped

  # The Redis Server
  apexbid-redis:
    image: redis:7-alpine
    container_name: apexbid-redis
    command: redis-server --appendonly no --maxmemory 256mb --maxmemory-policy noeviction
    ports:
      - "6379:6379"
    volumes:
      - redis_apexbid_data:/data
    restart: unless-stopped

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: apexbid-postgres-exporter
    environment:
      - DATA_SOURCE_NAME=postgresql://vaibhav_admin:password@apexbid-db:5432/apexbid_db?sslmode=disable
    ports:
      - "9187:9187"
    depends_on:
      - apexbid-db

  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: apexbid-redis-exporter
    environment:
      - REDIS_ADDR=redis://apexbid-redis:6379
    ports:
      - "9121:9121"
    depends_on:
      - apexbid-redis

  backend1:
    build: .
    container_name: apexbid-node-1
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://apexbid-db:5432/apexbid_db
      - SPRING_DATASOURCE_USERNAME=vaibhav_admin
      - SPRING_DATASOURCE_PASSWORD=password
      - SPRING_DATA_REDIS_HOST=apexbid-redis
      - SPRING_SQL_INIT_MODE=always  # This single node initializes the structural schema
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION_MS=${JWT_EXPIRATION_MS:-86400000}
      - PRODUCT_SECRET_ENCRYPTION_KEY=${PRODUCT_SECRET_ENCRYPTION_KEY}
      - NODE_ID=node-1
    depends_on:
      - apexbid-db
      - apexbid-redis

  backend2:
    build: .
    container_name: apexbid-node-2
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://apexbid-db:5432/apexbid_db
      - SPRING_DATASOURCE_USERNAME=vaibhav_admin
      - SPRING_DATASOURCE_PASSWORD=password
      - SPRING_DATA_REDIS_HOST=apexbid-redis
      - SPRING_SQL_INIT_MODE=never   #  Node 2  skips Schema initialization to eliminate race conditions
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION_MS=${JWT_EXPIRATION_MS:-86400000}
      - PRODUCT_SECRET_ENCRYPTION_KEY=${PRODUCT_SECRET_ENCRYPTION_KEY}
      - NODE_ID=node-2
    depends_on:
      - apexbid-db
      - apexbid-redis


  nginx-proxy:
    image: nginx:stable-alpine
    container_name: apexbid-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend1
      - backend2


  prometheus:
    image: prom/prometheus:latest
    container_name: apexbid-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - backend1
      - backend2


  grafana:
    image: grafana/grafana:latest
    container_name: apexbid-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
    depends_on:
      - prometheus

volumes:
  pg_apexbid_data:
  redis_apexbid_data:
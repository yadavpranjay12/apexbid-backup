worker_processes auto;
events { 
    worker_connections 20000; 
}

http {
    # Define a 1GB universal cache zone
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=global_cache:10m max_size=1g inactive=60m use_temp_path=off;

    # Define the group of servers to balance
    upstream auction_backend {
        least_conn; # Use least connections load balancing
        server backend1:8080;
        server backend2:8080;
    }

    server {
        listen 80;

        location /nginx_status {
            stub_status;
            allow 127.0.0.1;   # Only allow local requests for security
            allow all;         # For now, allow all for browser access
        }

        # Universal route for all traffic
        location / {
            proxy_pass http://auction_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            # WebSocket Support
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";

            # Universal 5-Second Cache for GET requests
            proxy_cache global_cache;
            proxy_cache_methods GET;
            proxy_cache_valid 200 5s;
            add_header X-Cache-Status $upstream_cache_status;

            # CRITICAL: Bypass the cache entirely if it is a WebSocket Upgrade request
            proxy_cache_bypass $http_upgrade;
        }
    }
}